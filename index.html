<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Gym Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8ECEF">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECEF;--card:#fff;--ink:#10202B;--mut:#5C6B76;--line:#D3DAE0;--acc:#2447F5;--ok:#1E8E5A;--bad:#C93B3B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,-apple-system,"Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:18px 16px 130px}
h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;letter-spacing:.2px}
h1{font-size:34px}h2{font-size:24px;margin:26px 0 10px}
.big{font-size:40px;line-height:1.05}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 10px;border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer}
button:active{transform:scale(.97)}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;padding:16px;font-size:18px}
button.s{padding:8px 12px;font-size:14px}
button.d{color:var(--bad)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;width:100%;padding:16px;font-size:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 3px}
.num{font-family:"Barlow Condensed",sans-serif;font-size:26px;text-align:center;padding:8px}
.set{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin:0 0 8px;background:var(--card);border:1px solid var(--line)}
.set.cur{border:2px solid var(--acc);flex-wrap:wrap}
.set.done{background:#E3F3EA;border-color:#B7DEC8}
.set.todo{opacity:.55}
.sn{font-family:"Barlow Condensed",sans-serif;font-size:26px;width:26px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--acc);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto}
.bar button{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.bar .t{font-family:"Barlow Condensed",sans-serif;font-size:48px;font-weight:700;line-height:1}
.prog{height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:#fff}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;background:var(--card)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.banner{background:var(--ink);color:#fff;border-radius:14px;padding:14px;margin:0 0 14px}
</style></head><body><main id="app"></main><div id="barwrap"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={routines:[],history:[],active:null};
try{const r=localStorage.getItem('gymlog');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('gymlog',JSON.stringify(S))}catch(e){}};
let view='home',draft=null,ctx=null,tick=null,armDel=false,msg='';
const fmt=n=>String(n).replace('.',',');
const fdate=t=>new Date(t).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
function lastFor(name){for(let i=S.history.length-1;i>=0;i--){const e=S.history[i].exs.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e)return e.sets}return null}
function beep(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[0,.25,.5].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.25;o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.15)});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
function go(v){view=v;msg='';armDel=false;render();window.scrollTo(0,0)}

function render(){
  const a=$('#app');
  a.innerHTML=({home:vHome,edit:vEdit,work:vWork,backup:vBackup})[view]();
  bar();
}
function vHome(){
  let h='<h1>Gym Log</h1>';
  if(S.active)h+=`<div class="banner"><b>Allenamento in corso</b><div class="mut" style="color:#B8C4CC">${esc(S.active.name)}</div><button class="p" style="margin-top:10px" data-a="resume">Riprendi</button></div>`;
  h+='<h2>Le mie routine</h2>';
  if(!S.routines.length)h+='<div class="card mut">Non hai ancora nessuna routine. Creane una, ad esempio "Workout A".</div>';
  S.routines.forEach(r=>{
    h+=`<div class="card"><div class="row sp"><div><div class="big" style="font-size:28px">${esc(r.name)}</div><div class="mut">${r.exs.length} esercizi${r.exs.length?': '+esc(r.exs.map(e=>e.name).join(', ')):''}</div></div></div>
    <div class="row" style="margin-top:12px"><button class="p grow" style="padding:12px;font-size:16px" data-a="start" data-i="${r.id}">Avvia</button><button data-a="edit" data-i="${r.id}">Modifica</button></div></div>`});
  h+='<button class="p" style="margin-top:6px;background:#fff;color:var(--acc)" data-a="new">Nuova routine</button>';
  if(S.history.length){h+='<h2>Ultimi allenamenti</h2>';
    S.history.slice(-6).reverse().forEach(w=>{const n=w.exs.reduce((t,e)=>t+e.sets.length,0);h+=`<div class="card"><div class="row sp"><b>${esc(w.name)}</b><span class="mut">${fdate(w.date)}</span></div><div class="mut">${n} serie · ${Math.round(w.dur/60000)} min</div></div>`})}
  h+='<div style="margin-top:20px"><button class="s" data-a="backup">Backup dati</button></div>';
  return h}
function vEdit(){
  const d=draft;
  let h=`<div class="row sp"><h1>${d.isNew?'Nuova routine':'Modifica routine'}</h1></div>
  <div style="margin-top:14px"><label>Nome routine</label><input data-k="name" value="${esc(d.name)}" placeholder="Workout A"></div><h2>Esercizi</h2>`;
  d.exs.forEach((e,i)=>{h+=`<div class="ex"><label>Esercizio ${i+1}</label><input data-k="name" data-i="${i}" value="${esc(e.name)}" placeholder="Panca piana">
  <div class="g3"><div><label>Serie</label><input class="num" type="number" inputmode="numeric" data-k="sets" data-i="${i}" value="${e.sets}"></div>
  <div><label>Ripetizioni</label><input class="num" type="number" inputmode="numeric" data-k="reps" data-i="${i}" value="${e.reps}"></div>
  <div><label>Recupero (s)</label><input class="num" type="number" inputmode="numeric" data-k="rest" data-i="${i}" value="${e.rest}"></div></div>
  <div class="row" style="margin-top:10px"><button class="s" data-a="up" data-i="${i}">Su</button><button class="s" data-a="down" data-i="${i}">Giù</button><span class="grow"></span><button class="s d" data-a="rm" data-i="${i}">Rimuovi</button></div></div>`});
  h+=`<button data-a="addex" style="width:100%;margin-bottom:16px">Aggiungi esercizio</button>
  <button class="p" data-a="saveR">Salva routine</button>
  <div class="row" style="margin-top:10px"><button class="grow" data-a="home">Annulla</button>${d.isNew?'':`<button class="grow d" data-a="delR">${armDel?'Tocca ancora per eliminare':'Elimina routine'}</button>`}</div>`;
  return h}
function vWork(){
  const a=S.active;
  if(a.ei>=a.exs.length){
    let h=`<h1>${esc(a.name)}</h1><h2>Riepilogo</h2>`;let tot=0;
    a.exs.forEach((e,i)=>{const l=a.log[i];tot+=l.length;h+=`<div class="card"><b>${esc(e.name)}</b><div class="mut">${l.length?l.map(s=>fmt(s.w)+' kg × '+s.r).join(' · '):'Saltato'}</div></div>`});
    return h+`<button class="ok" data-a="finish" style="margin-top:6px">Salva allenamento</button><div class="row" style="margin-top:10px"><button class="grow" data-a="back">Torna agli esercizi</button><button class="grow d" data-a="discard">${armDel?'Tocca ancora':'Scarta'}</button></div>`}
  const e=a.exs[a.ei],log=a.log[a.ei],prev=lastFor(e.name),n=+e.sets||1;
  let h=`<div class="row sp"><span class="mut">${esc(a.name)} · esercizio ${a.ei+1} di ${a.exs.length}</span></div>
  <div class="big" style="margin:6px 0">${esc(e.name||'Esercizio')}</div>
  <div class="mut">Obiettivo ${n} × ${e.reps} · recupero ${e.rest} s</div><div style="height:14px"></div>`;
  for(let i=0;i<n;i++){
    const p=prev&&prev[i],pt=p?`Scorsa volta ${fmt(p.w)} kg × ${p.r}`:'';
    if(i<log.length)h+=`<div class="set done"><span class="sn">${i+1}</span><b>${fmt(log[i].w)} kg × ${log[i].r}</b><span class="mut grow" style="text-align:right">${pt}</span></div>`;
    else if(i===log.length){const lw=log.length?log[log.length-1].w:(p?p.w:''),lr=p?p.r:e.reps;
      h+=`<div class="set cur"><span class="sn">${i+1}</span><div class="grow"><label>Peso (kg)</label><input class="num" id="w" type="text" inputmode="decimal" value="${lw}"></div><div class="grow"><label>Ripetizioni</label><input class="num" id="r" type="number" inputmode="numeric" value="${lr}"></div><div style="width:100%" class="mut">${pt||'Nessun dato precedente'}</div></div>`}
    else h+=`<div class="set todo"><span class="sn">${i+1}</span><span class="mut">${pt||'—'}</span></div>`}
  h+=`<button class="ok" data-a="done" style="margin-top:6px">Serie fatta</button>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="s" data-a="pe" ${a.ei?'':'disabled'}>Esercizio precedente</button><button class="s" data-a="ne">Salta esercizio</button>${log.length?'<button class="s" data-a="undo">Annulla ultima serie</button>':''}<button class="s d" data-a="end">Termina</button></div>`;
  return h}
function vBackup(){
  return `<h1>Backup dati</h1><p class="mut">Copia il testo qui sotto e conservalo (ad esempio nelle Note). Per ripristinare, incollalo nel secondo campo.</p>
  <label>I tuoi dati</label><textarea id="exp" rows="6" readonly>${esc(JSON.stringify({routines:S.routines,history:S.history}))}</textarea>
  <div class="row" style="margin:8px 0 20px"><button class="grow" data-a="copy">Copia backup</button></div>
  <label>Incolla un backup per ripristinare</label><textarea id="imp" rows="5"></textarea>
  <button class="p" style="margin-top:8px" data-a="import">Ripristina dati</button>
  <p class="mut" id="bm">${msg}</p><button data-a="home" style="margin-top:6px">Indietro</button>`}

function bar(){
  const a=S.active,w=$('#barwrap');
  if(view==='work'&&a&&a.restEnd>Date.now()){
    w.innerHTML=`<div class="bar"><div class="in"><div class="row sp"><div><div class="mut" style="color:#D6DEFF">Recupero</div><div class="t" id="rt"></div></div><div class="row"><button data-a="m15">−15</button><button data-a="p15">+15</button><button data-a="skip">Salta</button></div></div><div class="prog"><i id="rp"></i></div></div></div>`;
    upd();clearInterval(tick);tick=setInterval(upd,250)}
  else{w.innerHTML='';clearInterval(tick)}}
function upd(){
  const a=S.active;if(!a||!a.restEnd)return;
  const left=a.restEnd-Date.now();
  if(left<=0){a.restEnd=0;save();beep();render();return}
  const s=Math.ceil(left/1000);$('#rt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#rp').style.width=Math.max(0,left/(a.restTotal*1000))*100+'%'}
function rest(sec){const a=S.active;if(sec>0){a.restEnd=Date.now()+sec*1000;a.restTotal=sec}else a.restEnd=0}

document.addEventListener('input',e=>{
  if(view!=='edit'||!e.target.dataset.k)return;
  const k=e.target.dataset.k,i=e.target.dataset.i;
  if(i===undefined)draft.name=e.target.value;else draft.exs[i][k]=(k==='name')?e.target.value:e.target.value});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=S.active,i=b.dataset.i,x=b.dataset.a;
  switch(x){
    case'home':go('home');break;
    case'new':draft={isNew:true,id:uid(),name:'',exs:[{id:uid(),name:'',sets:3,reps:10,rest:90}]};go('edit');break;
    case'edit':draft=JSON.parse(JSON.stringify(S.routines.find(r=>r.id===i)));go('edit');break;
    case'addex':draft.exs.push({id:uid(),name:'',sets:3,reps:10,rest:90});render();break;
    case'rm':draft.exs.splice(+i,1);render();break;
    case'up':if(+i>0){const t=draft.exs.splice(+i,1)[0];draft.exs.splice(+i-1,0,t);render()}break;
    case'down':if(+i<draft.exs.length-1){const t=draft.exs.splice(+i,1)[0];draft.exs.splice(+i+1,0,t);render()}break;
    case'saveR':{const r={id:draft.id,name:draft.name.trim()||'Workout',exs:draft.exs.filter(z=>z.name.trim()).map(z=>({id:z.id,name:z.name.trim(),sets:Math.max(1,+z.sets||1),reps:Math.max(1,+z.reps||1),rest:Math.max(0,+z.rest||0)}))};
      const k=S.routines.findIndex(q=>q.id===r.id);k<0?S.routines.push(r):S.routines[k]=r;save();go('home');break}
    case'delR':if(!armDel){armDel=true;render()}else{S.routines=S.routines.filter(r=>r.id!==draft.id);save();go('home')}break;
    case'start':{const r=S.routines.find(q=>q.id===i);if(!r||!r.exs.length){alert('Aggiungi almeno un esercizio alla routine.');break}
      S.active={name:r.name,start:Date.now(),exs:JSON.parse(JSON.stringify(r.exs)),ei:0,log:r.exs.map(()=>[]),restEnd:0,restTotal:0};save();wake();go('work');break}
    case'resume':wake();go('work');break;
    case'done':{const e0=a.exs[a.ei],w=parseFloat(String($('#w').value).replace(',','.')),r=parseInt($('#r').value);
      ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume&&ctx.resume();
      a.log[a.ei].push({w:isNaN(w)?0:w,r:isNaN(r)?0:r});
      if(a.log[a.ei].length>=(+e0.sets||1)){a.ei++;a.ei<a.exs.length?rest(+e0.rest):rest(0)}else rest(+e0.rest);
      save();render();window.scrollTo(0,0);break}
    case'undo':a.log[a.ei].pop();rest(0);save();render();break;
    case'ne':a.ei++;rest(0);save();render();window.scrollTo(0,0);break;
    case'pe':a.ei=Math.max(0,a.ei-1);rest(0);save();render();window.scrollTo(0,0);break;
    case'end':a.ei=a.exs.length;rest(0);save();render();break;
    case'back':a.ei=Math.max(0,a.exs.length-1);save();render();break;
    case'discard':if(!armDel){armDel=true;render()}else{S.active=null;save();go('home')}break;
    case'finish':{const exs=a.exs.map((q,k)=>({name:q.name,sets:a.log[k]})).filter(q=>q.sets.length);
      if(exs.length)S.history.push({id:uid(),name:a.name,date:Date.now(),dur:Date.now()-a.start,exs});S.active=null;save();go('home');break}
    case'm15':a.restEnd=Math.max(Date.now()+1000,a.restEnd-15000);save();bar();break;
    case'p15':a.restEnd+=15000;a.restTotal+=15;save();bar();break;
    case'skip':rest(0);save();render();break;
    case'backup':go('backup');break;
    case'copy':{const t=$('#exp');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{$('#bm').textContent='Backup copiato.'},()=>{document.execCommand('copy');$('#bm').textContent='Backup copiato.'})}catch(er){document.execCommand('copy')}break}
    case'import':try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.routines)||!Array.isArray(d.history))throw 0;S.routines=d.routines;S.history=d.history;save();go('backup');msg='Dati ripristinati.';render()}catch(er){$('#bm').textContent='Testo non valido: incolla il backup completo.'}break}
});
render();
</script></body></html>
